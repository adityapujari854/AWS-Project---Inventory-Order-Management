<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products | {{ app_name }}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    <script src="{{ url_for('static', path='js/image-resolver.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/products.js') }}" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">{{ app_name }}</a>
      <nav aria-label="Primary navigation">
        <a href="/">Dashboard</a><a class="active" href="/products">Products</a><a href="/inventory">Inventory</a><a href="/orders">Orders</a><a href="/suppliers">Suppliers</a><a href="/analytics">Analytics</a><a href="/advisor">Advisor</a>
      </nav>
      <div class="account-menu"><span>{{ admin_username }}</span><form method="post" action="/auth/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">Sign out</button></form></div>
    </header>
    <main>
      <section class="hero compact-hero"><p class="eyebrow">Product catalogue</p><h1>Products and categories</h1><p>Manage product details, stock-ready categories, and private S3 product images.</p></section>
      <p id="product-image-message" class="operation-message" role="status"></p>
      <section class="catalogue-toolbar" aria-label="Product controls"><input id="product-search" type="search" placeholder="Search products or SKU"><select id="category-filter"><option value="">All categories</option></select><button id="new-product" class="upload-button" type="button">Add product</button></section>
      <form id="product-form" class="product-form" hidden><input id="product-id" type="hidden"><label>SKU<input id="product-sku" required maxlength="64"></label><label>Name<input id="product-name" required maxlength="160"></label><label>Category<select id="product-category" required></select></label><label>Description<input id="product-description" maxlength="500"></label><label>Price<input id="product-price" type="number" min="0" step="0.01" required></label><label>Cost<input id="product-cost" type="number" min="0" step="0.01" required></label><label>Initial stock<input id="product-quantity" type="number" min="0" required></label><label>Reorder threshold<input id="product-threshold" type="number" min="0" required></label><div><button class="upload-button" type="submit">Save product</button><button id="cancel-product" class="secondary-button" type="button">Cancel</button></div></form>
      <section id="product-image-list" class="product-image-grid"><p class="empty-state">Loading products…</p></section>
    </main>
    <footer class="brand-footer">InventoryHub · Built by Aditya</footer>
  </body>
</html>
